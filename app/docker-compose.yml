services:
  app:
    build:
      context: .
      target: runtime
      args:
        BASE_PATH: ${BASE_PATH:-/}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      BASE_PATH: ${BASE_PATH:-/}
      APP_DATA_DIR: /app/data
      APP_ORIGIN: ${APP_ORIGIN:?Set the canonical app origin}
      LEGACY_USER_EMAIL: ${LEGACY_USER_EMAIL:-}
      MIGRATION_BACKUP_DIR: /app/backups
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_HEAVY_MODEL: ${OPENAI_HEAVY_MODEL:-gpt-5.4}
    ports:
      - "127.0.0.1:${APP_PORT_EXPOSE:-3000}:3000"
    volumes:
      - type: volume
        source: comic-book-data
        target: /app/data
      - type: volume
        source: comic-book-backups
        target: /app/backups

volumes:
  comic-book-data:
  comic-book-backups:
